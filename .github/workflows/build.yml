name: Build and test

on: [push, workflow_dispatch, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.24.x', '1.25.x', '1.26.x' ]

    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go get ./...
      - name: Check documentation is up to date
        run: |
          make doc
          # git diff reports tracked files only. docgen writes one page per
          # command, so a brand new command produces a brand new file, which is
          # untracked and therefore invisible here: the gate stayed green while
          # the page was never committed. git status reports untracked files
          # too, which is the whole point of the check.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is not clean after 'make doc'. Please run 'make doc' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi
      - name: Build binary
        run: make
      - name: Build WASM binary
        run: make wasm
      - name: Test with Go
        run: make test
